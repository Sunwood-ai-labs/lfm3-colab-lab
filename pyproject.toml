[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lfm3-colab-lab"
version = "0.1.0"
description = "A compact Python interface to six fixed LFM3 Colab experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Sunwood-ai-labs"}]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Sunwood-ai-labs/lfm3-colab-lab"
Issues = "https://github.com/Sunwood-ai-labs/lfm3-colab-lab/issues"
Documentation = "https://sunwood-ai-labs.github.io/lfm3-colab-lab/"
Source = "https://github.com/Sunwood-ai-labs/lfm3-colab-lab"

[project.scripts]
lfm3-lab = "lfm3_lab.cli:main"

[tool.setuptools]
packages = ["lfm3_lab", "lfm3_lab.experiments"]
package-dir = {"" = "src", "lfm3_lab.experiments" = "experiments"}
