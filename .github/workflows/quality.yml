name: Notebook and source quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install validation dependencies
        run: |
          python -m pip install pytest nbformat ipython pillow
          python -m pip install --no-deps -e .
      - name: Test the notebook and notebook-facing API
        run: python -m pytest -q
      - name: Validate the public notebook
        run: python tools/check_notebook.py
      - name: Check the public payload
        run: python tools/check_public_payload.py

