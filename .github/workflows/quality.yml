name: Notebook and source quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install pytest nbformat ipython pillow
          python -m pip install --no-deps -e .
      - name: Test the notebook and notebook-facing API
        run: python -m pytest -q
      - name: Validate the public notebook
        run: python tools/check_notebook.py
      - name: Check the public payload
        run: python tools/check_public_payload.py

